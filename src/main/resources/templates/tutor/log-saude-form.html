<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Registrar log de saúde')}"></head>
<body>
<nav th:replace="~{fragments/nav :: topbar}"></nav>
<main class="wrap">
    <section class="hero">
        <h1>Registrar log de saúde</h1>
        <p>Valores fora dos limites da métrica são recusados. Cadastre um pet antes, se a lista estiver vazia.</p>
    </section>

    <p th:if="${pets.isEmpty()}" class="alert alert-error">
        Você ainda não tem pets.
        <a th:href="@{/tutor/pets/novo}">Cadastrar pet</a>
    </p>

    <form th:unless="${pets.isEmpty()}" th:action="@{/tutor/logs-saude}" th:object="${logSaude}" method="post" class="panel">
        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-error">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>
        <label>
            Pet
            <select th:field="*{idPet}">
                <option value="">Selecione</option>
                <option th:each="pet : ${pets}" th:value="${pet.idPet}" th:text="${pet.nomePet}">Thor</option>
            </select>
            <span class="field-error" th:errors="*{idPet}"></span>
        </label>
        <label>
            Métrica
            <select th:field="*{metrica}">
                <option value="">Selecione</option>
                <option th:each="item : ${metricas}" th:value="${item.key}" th:text="${item.value}">Peso</option>
            </select>
            <span class="field-error" th:errors="*{metrica}"></span>
        </label>
        <label>
            Valor
            <input type="number" step="0.01" th:field="*{vlMetrica}">
            <span class="field-error" th:errors="*{vlMetrica}"></span>
        </label>
        <label>
            Data e hora
            <input type="datetime-local" th:field="*{dtRegistro}">
            <span class="field-error" th:errors="*{dtRegistro}"></span>
        </label>
        <label>
            Observação
            <textarea th:field="*{obs}" rows="3" maxlength="255"></textarea>
            <span class="field-error" th:errors="*{obs}"></span>
        </label>
        <div class="actions">
            <button type="submit">Salvar log</button>
            <a class="btn btn-secondary" th:href="@{/tutor/logs-saude}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
