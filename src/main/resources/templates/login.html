<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Login')}"></head>
<body class="login-body">
<section class="login-card">
    <p class="muted">Plataforma de gestão de saúde pet</p>
    <h1>Clyvo Care</h1>
    <p>Entre com o e-mail e a senha do seu perfil.</p>

    <div th:if="${param.error}" class="alert alert-error">E-mail ou senha inválidos.</div>
    <div th:if="${param.logout}" class="alert alert-ok">Sessão encerrada.</div>

    <form th:action="@{/login}" method="post" class="panel" style="box-shadow:none;border:0;padding:0;background:transparent">
        <label>
            E-mail
            <input type="email" name="username" autocomplete="username" required>
        </label>
        <label>
            Senha
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Entrar</button>
    </form>

    <div class="hint" style="margin-top:1.2rem">
        <strong>Usuários de demonstração</strong><br>
        Tutor: maria@email.com / senha123<br>
        Veterinário: carlos.vet@clyvo.com / senha123
    </div>
</section>
</body>
</html>
